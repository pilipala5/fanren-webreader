<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传书本</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .col{display:grid;gap:10px}
    input[type="text"]{appearance:none;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px;width:360px;max-width:90vw}
    .muted{color:var(--muted);font-size:12px}
    .list{max-height:260px;overflow:auto;border:1px dashed var(--border);border-radius:10px;padding:8px 10px;background:#fafafa}
    .progress{height:8px;background:#eef2ff;border-radius:999px;overflow:hidden}
    .progress>span{display:block;height:100%;background:var(--brand);width:0%}
    .right{margin-left:auto}
    .danger{color:#b91c1c}
    .hidden{display:none}
    .badge{display:inline-block;padding:1px 6px;border-radius:999px;font-size:11px;background:#eef2ff;color:#334155;margin-left:8px}
  </style>
  <script>
    /* ------------------- 基础 & 配置 ------------------- */
    const $ = (id)=>document.getElementById(id);
    let API_AVAILABLE=false;
    let state={ userName:null, file:null, text:'', encoding:'auto', chapters:[], title:'', cover:null };

    // 目录/短章识别阈值（温和，按需微调）
    const TOC_CONF = {
      linkDensity: 0.35,          // 链接密度阈值（a 标签数 / 文本行数）
      chapterHeadingMin: 10,      // “第X章/回/节/篇 …”命中行最少数量
      plainTextMax: 400,          // 去掉链接文本后的纯文本最大字数
      liCountMin: 10,             // <li> 数量较多也提示目录
      shortChapterLen: 120,       // 结果清洗：极短章节长度阈值
      shortClusterThreshold: 15,  // 结果清洗：极短簇阈值（连续 N 个极短章）
      duplicateWindow: 5          // 结果清洗：标题重复查找窗口
    };

    // 章节标题识别
    const CHAPTER_TITLE_RE = /^(?:\s*(?:正文)\s*)?(?:(?:第[〇零一二三四五六七八九十百千万两0-9０-９]+(?:卷|部|集|回|编)\s*)?)第[〇零一二三四五六七八九十百千万两0-9０-９]+(?:章|回|节|话|篇)[^\n\r]*$|^\s*(序章|楔子|引子|终章|尾声|后记|番外(?:[ 0-9０-９一二三四五六七八九十百千万两]*)?|外传|完本感言|大结局)[^\n\r]*$/;
    const TOC_KEYWORDS_RE = /(目录|目次|contents|返回目录|回目录|主目录)/i;

    /* ------------------- API & 登录 ------------------- */
    async function pingAPI(){ const c=new AbortController(); setTimeout(()=>c.abort(),700); try{ const r=await fetch('/api/health',{signal:c.signal}); API_AVAILABLE=r.ok; }catch{ API_AVAILABLE=false; } }
    async function authMe(){ if(!API_AVAILABLE) return null; try{ const r=await fetch('/api/auth/me'); if(!r.ok) return null; return await r.json(); }catch{return null;} }
    async function authLogin(username,password){ if(!API_AVAILABLE) return { ok:false, error:'api disabled' }; const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}); return await r.json(); }
    function renderAuth(){ const el=$('userName'); if(el) el.textContent=state.userName||'未登录'; }
    async function ensureLogin(){ if(!API_AVAILABLE) return false; if(state.userName) return true; const u=prompt('用户名'); if(!u) return false; const p=prompt('密码（不少于6位）'); if(!p) return false; const r=await authLogin(u,p); if(r&&r.ok){ state.userName=u; renderAuth(); return true; } alert(r?.error||'登录失败'); return false; }

    /* ------------------- 工具函数 ------------------- */
    const norm = s => String(s||'').replace(/^[\s\u3000]+|[\s\u3000]+$/g,'').replace(/\s+/g,' ').toLowerCase();

    // 去掉正文开头重复的标题 & 收敛空行
    function stripLeadingTitle(text, title){
      let lines = String(text||'').replace(/\r\n?/g,'\n').split('\n');
      const t = norm(title);
      for(let k=0;k<2;k++){ if(lines.length && norm(lines[0])===t) lines.shift(); }
      let s = lines.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/, '');
      return s;
    }

    function inferTitleFromFile(file){ const name=file?.name||''; if(!name) return ''; const base=name.replace(/\.[^.]+$/,''); return base.slice(0,60); }

    async function readFileAsText(file, enc){
      const buf = await file.arrayBuffer();
      const tryDecode=(label)=>{ try{ const td=new TextDecoder(label,{fatal:true}); return td.decode(buf); }catch{ return null; } };
      if(enc==='auto'){
        return tryDecode('utf-8') ?? tryDecode('utf-8-sig') ?? tryDecode('gbk') ?? tryDecode('gb18030') ?? new TextDecoder('utf-8').decode(buf);
      }
      const label=(enc==='gbk'||enc==='gb2312'||enc==='gb18030')?'gbk':enc;
      return tryDecode(label) ?? new TextDecoder(label,{fatal:false}).decode(buf);
    }

    function textLines(s){ return String(s||'').replace(/\r\n?/g,'\n').split('\n').map(x=>x.trim()); }
    function countChapterHeadingLines(txt){
      const lines=textLines(txt).filter(Boolean);
      let n=0; for(const ln of lines){ if(CHAPTER_TITLE_RE.test(ln)) n++; }
      return n;
    }

    // 仅本地依赖（绝对路径）
    function loadScriptLocal(src){
      return new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src = src.startsWith('/') ? src : ('/' + src.replace(/^\/+/, ''));
        s.async=true;
        s.onload=()=>resolve();
        s.onerror=()=>reject(new Error('脚本加载失败：'+s.src+'（请确认该文件已随站点发布）'));
        document.head.appendChild(s);
      });
    }
    async function ensureJSZip(){
      if(window.JSZip) return;
      await loadScriptLocal('/assets/jszip.min.js');
      if(!window.JSZip){ throw new Error('JSZip 未正确加载（/assets/jszip.min.js）'); }
    }
    async function ensurePDF(){
      if(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) return;
      await loadScriptLocal('/assets/pdf.min.js');
      if(!(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions)){ throw new Error('PDF.js 未正确加载（/assets/pdf.min.js）'); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/pdf.worker.min.js';
    }

    async function blobToDataURL(blob){ return await new Promise((res)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result)); fr.readAsDataURL(blob); }); }
    async function shrinkImageDataURL(dataUrl, maxW=360, maxH=480, quality=0.82){
      return await new Promise((res)=>{ const img=new Image(); img.onload=()=>{ const r=Math.min(maxW/img.width, maxH/img.height, 1); const w=Math.round(img.width*r), h=Math.round(img.height*r); const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg', quality)); }; img.src=dataUrl; });
    }

    /* ------------------- 切章（不再把标题写进正文） ------------------- */
    function splitChapters(text){
      text=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      const lines=text.split('\n');
      const isHeading=(s)=>CHAPTER_TITLE_RE.test(String(s||'').trim());
      const hits=[];
      for(let i=0;i<lines.length;i++){ if(isHeading(lines[i])) hits.push({i,title:lines[i].trim()}); }

      const chapters=[];
      const pushChapter=(idx,title,bodyLines)=>{
        const ttl=String(title||'').trim()||`章节 ${idx}`;
        const outLines = bodyLines.slice();
        if(outLines.length && norm(outLines[0])===norm(ttl)) outLines.shift(); // 去掉正文首行“与标题相同”的行
        let content = outLines.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/, '');
        chapters.push({ index: idx, title: ttl, content: content.replace(/\n+$/,'') });
      };

      if(hits.length===0){
        pushChapter(1,'全文',lines);
        return chapters;
      }
      if(hits[0].i>0){
        const pre=lines.slice(0,hits[0].i);
        if(pre.some(s=>String(s).trim())) pushChapter(0,'开篇',pre);
      }
      for(let k=0;k<hits.length;k++){
        const start=hits[k].i;
        const end=(k+1<hits.length)? hits[k+1].i : lines.length;
        const body=lines.slice(start,end);
        pushChapter(chapters.length? chapters[chapters.length-1].index+1 : (hits[0].i>0? 1 : 1), hits[k].title, body);
      }
      for(let i=0;i<chapters.length;i++){ chapters[i].index = i + (chapters[0].title==='开篇'? 0 : 1); }
      return chapters;
    }

    /* ------------------- 目录页识别（EPUB 内容层） ------------------- */
    function isInternalHref(href){
      if(!href) return false;
      const t=href.trim();
      if(t.startsWith('#')) return true;
      if(/^https?:/i.test(t)) return false;
      return /\.(xhtml?|xml)(#|$)/i.test(t);
    }
    function isLikelyTocDoc(doc){
      try{
        const body=doc.body||doc;
        const text=body.textContent||'';
        const lines=textLines(text).filter(Boolean);
        const aList=[...doc.querySelectorAll('a')];
        const liCount=doc.querySelectorAll('li').length;
        const internalLinks=aList.filter(a=>isInternalHref(a.getAttribute('href'))).length;
        const linkDensity = lines.length? (aList.length/lines.length) : 0;

        const anchorTextLen = aList.reduce((s,a)=> s + (a.textContent||'').trim().length, 0);
        const plainLen = Math.max(0, text.trim().length - anchorTextLen);

        const headingLines = countChapterHeadingLines(text);
        const firstLine = (lines[0]||'').slice(0,20);
        const title = (doc.querySelector('title')?.textContent||'').trim();
        const hasKeyword = TOC_KEYWORDS_RE.test(firstLine) || TOC_KEYWORDS_RE.test(title);

        if(headingLines >= TOC_CONF.chapterHeadingMin && (linkDensity >= TOC_CONF.linkDensity || (internalLinks >= 8 && internalLinks >= aList.length*0.6))) return true;
        if(liCount >= TOC_CONF.liCountMin && headingLines >= 6) return true;
        if(hasKeyword && headingLines >= 6 && plainLen <= TOC_CONF.plainTextMax) return true;
      }catch{}
      return false;
    }

    /* ------------------- 结果清洗（兜底） ------------------- */
    function postCleanChapters(chapters){
      const cleaned=[];
      let i=0;
      while(i<chapters.length){
        let j=i, cnt=0;
        while(j<chapters.length && chapters[j].content.trim().length <= TOC_CONF.shortChapterLen){ j++; cnt++; }
        if(cnt >= TOC_CONF.shortClusterThreshold){ i=j; continue; } // 丢弃“极短簇”
        const ch=chapters[i];
        const txt=ch.content.trim();
        const isVeryShort = txt.length <= TOC_CONF.shortChapterLen;
        const hasTocKeyword = TOC_KEYWORDS_RE.test(txt);
        const looksLikeHeadingOnly = CHAPTER_TITLE_RE.test(ch.title||'') && textLines(txt).length <= 3;

        let hasLongSameAfter=false;
        if(isVeryShort && looksLikeHeadingOnly){
          const winEnd=Math.min(chapters.length-1, i+TOC_CONF.duplicateWindow);
          for(let k=i+1;k<=winEnd;k++){
            if((chapters[k].title||'').trim() === (ch.title||'').trim() && (chapters[k].content||'').trim().length > 200){
              hasLongSameAfter=true; break;
            }
          }
        }
        if(isVeryShort && (hasTocKeyword || looksLikeHeadingOnly || hasLongSameAfter)){
          // 丢弃
        }else{
          cleaned.push(ch);
        }
        i++;
      }
      for(let t=0;t<cleaned.length;t++){ cleaned[t].index=t+1; }
      return cleaned;
    }

    /* ------------------- EPUB 解析（三层过滤集成） ------------------- */
    async function parseEpub(file){
      await ensureJSZip();
      const buf=await file.arrayBuffer();
      const zip=await JSZip.loadAsync(buf);
      const readText=async(p)=>{ const f=zip.file(p); if(!f) throw new Error('EPUB 文件缺失: '+p); return await f.async('string'); };
      const find=(p)=>zip.file(p);

      const container=await readText('META-INF/container.xml');
      const cx=new DOMParser().parseFromString(container,'text/xml');
      const root=cx.querySelector('rootfile'); if(!root) throw new Error('未找到 rootfile');
      const opfPath=root.getAttribute('full-path');
      const opfText=await readText(opfPath);
      const opf=new DOMParser().parseFromString(opfText,'text/xml');

      const baseDir=opfPath.split('/').slice(0,-1).join('/');
      const resolve=(href)=> href && (baseDir? (baseDir+'/'+href).replace(/\/+/, '/') : href);

      // manifest
      const manifest=new Map();
      opf.querySelectorAll('manifest > item').forEach(it=>{
        manifest.set(it.getAttribute('id'), {
          id: it.getAttribute('id'),
          href: resolve(it.getAttribute('href')),
          media: it.getAttribute('media-type'),
          props: (it.getAttribute('properties')||'').toLowerCase()
        });
      });

      // 层 1：基于元数据排除“导航/非正文”
      const excludedHrefs=new Set();
      for(const it of manifest.values()){
        if((it.props||'').split(/\s+/).includes('nav')) excludedHrefs.add(it.href); // EPUB3 nav
      }
      const guideToc = opf.querySelector('guide > reference[type="toc"]')?.getAttribute('href');
      if(guideToc) excludedHrefs.add(resolve(guideToc));
      const guideEx = ['cover','title-page','copyright-page','acknowledgements','colophon','glossary','index'];
      opf.querySelectorAll('guide > reference').forEach(ref=>{
        const type=(ref.getAttribute('type')||'').toLowerCase();
        if(guideEx.includes(type)){ excludedHrefs.add(resolve(ref.getAttribute('href')||'')); }
      });

      // spine 顺序（仅 HTML/XHTML）
      const spineItems = Array
        .from(opf.querySelectorAll('spine > itemref'))
        .map(it=> manifest.get(it.getAttribute('idref')))
        .filter(Boolean)
        .filter(it=>{
          if(!it.href) return false;
          if(!(it.media? /xhtml|html/i.test(it.media) : /\.(x?html?)$/i.test(it.href))) return false;
          if(excludedHrefs.has(it.href)) return false;
          return true;
        });

      // 封面
      let coverHref=null;
      const coverByProp=Array.from(opf.querySelectorAll('manifest > item[properties~="cover-image"]'))[0];
      if(coverByProp) coverHref=resolve(coverByProp.getAttribute('href'));
      if(!coverHref){
        const metaId=opf.querySelector('metadata > meta[name="cover"]')?.getAttribute('content');
        if(metaId && manifest.get(metaId)) coverHref=manifest.get(metaId).href;
      }
      if(!coverHref){
        for(const [id,it] of manifest){ if(/cover/i.test(it.href) && /^image\//.test(it.media||'')){ coverHref=it.href; break; } }
      }

      let cover=null;
      if(coverHref && find(coverHref)){
        const blob=await zip.file(coverHref).async('blob');
        const data=await blobToDataURL(blob);
        cover=await shrinkImageDataURL(data,360,480,0.82);
      }

      // 遍历 spine：层 2 内容判定 → 切章 → 层 3 清洗
      const chapters=[];
      let idx=1;
      for(const it of spineItems){
        if(!it||!it.href) continue;
        const html=await readText(it.href);
        const doc=new DOMParser().parseFromString(html,'text/html');

        // 层 2：像目录页就整页跳过
        if(isLikelyTocDoc(doc)){
          console.debug('[EPUB] 跳过目录页：', it.href);
          continue;
        }

        const t=(doc.querySelector('h1,h2,title')?.textContent||'').trim()||`章节 ${idx}`;
        const rawText=doc.body ? (doc.body.textContent||'') : html.replace(/<[^>]+>/g,'');
        const text = stripLeadingTitle(rawText, t); // 关键：去掉正文开头重复标题 & 收敛空行
        const splits=splitChapters(text);

        if(splits.length<=1){
          chapters.push({ index: idx++, title: t, content: text });
        } else {
          for(const s of splits){ chapters.push({ index: idx++, title: s.title, content: s.content }); }
        }
      }

      const title=(opf.querySelector('metadata > title, metadata > dc\\:title')?.textContent||'').trim()||inferTitleFromFile(file);
      const cleaned = postCleanChapters(chapters);
      return { title, chapters: cleaned, cover }
    }

    /* ------------------- PDF 解析（页级目录过滤 + 兜底清洗） ------------------- */
    function isLikelyPdfToc(text){
      const lines=textLines(text).filter(Boolean);
      const headingLines=lines.reduce((n,ln)=> n + (CHAPTER_TITLE_RE.test(ln)?1:0), 0);
      const hasKeyword = TOC_KEYWORDS_RE.test(lines[0]||'') || TOC_KEYWORDS_RE.test(lines.slice(0,5).join(' '));
      const avgLen = lines.length? (lines.join('').length/lines.length) : 0;
      if(headingLines >= TOC_CONF.chapterHeadingMin && (avgLen < 20 || hasKeyword)) return true;
      if(hasKeyword && headingLines >= 8) return true;
      return false;
    }
    async function parsePdf(file){
      await ensurePDF();
      const data=new Uint8Array(await file.arrayBuffer());
      const pdf=await window.pdfjsLib.getDocument({ data }).promise;
      const pages=[];
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const txt=await page.getTextContent();
        const s=(txt.items||[]).map(it=>it.str||'').join(' ');
        if(isLikelyPdfToc(s)){ console.debug('[PDF] 跳过目录页：page', p); continue; }
        pages.push(s);
      }
      const full=pages.join('\n');
      let chapters=splitChapters(full);
      if(chapters.length<=1){
        chapters = pages.map((s,i)=>({ index:i+1, title:`第 ${i+1} 页`, content: s.replace(/\n{3,}/g,'\n\n').replace(/^\n+/, '') }));
      } else {
        for(let i=0;i<chapters.length;i++){ chapters[i].index=i+1; }
      }
      const title=inferTitleFromFile(file);
      const cleaned = postCleanChapters(chapters);
      return { title, chapters: cleaned, cover:null }
    }

    /* ------------------- 上传流程 ------------------- */
    async function uploadInBatches(bookId, chapters){
      const BATCH=50; let sent=0;
      $('progWrap').classList.remove('hidden');
      $('progText').textContent='上传中…';
      for(let i=0;i<chapters.length;i+=BATCH){
        const slice=chapters.slice(i,i+BATCH);
        const r=await fetch(`/api/books/${encodeURIComponent(bookId)}/chapters`,{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapters:slice})
        });
        const j=await r.json();
        if(!(r.ok&&j&&j.ok)) throw new Error(j?.error||('上传失败 @'+i));
        sent+=slice.length;
        const pct=Math.round(100*sent/chapters.length);
        $('prog').style.width=pct+'%';
        $('progText').textContent=`已上传 ${sent}/${chapters.length}`;
      }
    }

    /* ------------------- 事件处理 ------------------- */
    async function handleParse(){
      $('btnParse').disabled=true; $('btnUpload').disabled=true;
      $('info').textContent='解析中…'; $('previewList').innerHTML='';
      const file=state.file;
      if(!file){ $('info').textContent='未选择文件'; $('btnParse').disabled=false; return; }

      try{
        const name=(file.name||'').toLowerCase();
        let out=null;
        if(/\.txt$/.test(name)){
          const enc=$('enc').value||'auto';
          const text=await readFileAsText(file,enc);
          out={ title: inferTitleFromFile(file), chapters: postCleanChapters(splitChapters(text)), cover:null };
        } else if(/\.epub$/.test(name)){
          out=await parseEpub(file);
        } else if(/\.pdf$/.test(name)){
          out=await parsePdf(file);
        } else {
          throw new Error('不支持的文件类型');
        }

        state.title=out.title||inferTitleFromFile(file);
        state.chapters=out.chapters||[];
        state.cover=out.cover||null;
        $('title').value = $('title').value || state.title;

        $('info').innerHTML=`标题：${state.title} · 章节数：${state.chapters.length}`;
        const list=$('previewList');
        for(const ch of state.chapters.slice(0,120)){
          const li=document.createElement('div');
          const isVeryShort = (ch.content||'').trim().length <= TOC_CONF.shortChapterLen;
          li.textContent=`${String(ch.index).padStart(4,'0')} · ${ch.title}`;
          if(isVeryShort){
            const b=document.createElement('span');
            b.className='badge'; b.textContent='短章';
            li.appendChild(b);
          }
          list.appendChild(li);
        }
        $('btnUpload').disabled=state.chapters.length===0;
      } catch(e){
        $('info').innerHTML=`<span class="danger">${String(e)}</span>`;
      } finally {
        $('btnParse').disabled=false;
      }
    }

    async function handleUpload(){
      if(!API_AVAILABLE){ alert('未连接 API，无法上传'); return; }
      if(!await ensureLogin()) return;
      const title=String($('title').value||'').trim() || state.title || inferTitleFromFile(state.file);
      if(!title){ alert('请填写书名'); return; }
      if(!state.chapters.length){ alert('请先解析文件'); return; }
      $('btnUpload').disabled=true;
      try{
        const r1=await fetch('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ title, cover: state.cover||undefined })});
        const j1=await r1.json();
        if(!(r1.ok&&j1&&j1.ok&&j1.id)) throw new Error(j1?.error||'创建书籍失败');
        const id=j1.id;
        await uploadInBatches(id, state.chapters);
        $('done').innerHTML=`发布完成，<a href="viewer.html?srv=${encodeURIComponent(id)}">点击阅读</a>`;
        $('done').classList.remove('hidden');
      } catch(e){
        alert(String(e));
      } finally {
        $('btnUpload').disabled=false;
      }
    }

    function bind(){
      $('file').addEventListener('change',(e)=>{
        state.file=e.target.files?.[0]||null;
        $('btnParse').disabled=!state.file;
        $('btnUpload').disabled=true;
        $('previewList').innerHTML='';
        $('info').textContent='';
        $('done').classList.add('hidden');
        $('progWrap').classList.add('hidden');
        $('prog').style.width='0%';
      });
      $('btnParse').addEventListener('click', handleParse);
      $('btnUpload').addEventListener('click', handleUpload);
    }

    async function init(){
      await pingAPI();
      const me=await authMe();
      if(me&&me.ok&&me.loggedIn) state.userName=me.username;
      renderAuth();
      bind();
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="topbar">
    <div class="container row">
      <a class="btn" href="/">← 返回首页</a>
      <div class="brand">上传书本</div>
      <div class="spacer"></div>
      <span class="small">账号：</span><strong id="userName" class="small">未登录</strong>
    </div>
  </div>

  <div class="container col" style="gap:14px">
    <div class="card col">
      <div class="row">
        <label class="inline">选择文件：<input id="file" type="file" accept=".txt,.epub,.pdf,text/plain,application/epub+zip,application/pdf" /></label>
        <label class="inline">编码：
          <select id="enc">
            <option value="auto" selected>自动</option>
            <option value="utf-8">UTF-8</option>
            <option value="gbk">GBK/GB2312</option>
            <option value="gb18030">GB18030（采 GBK 解码）</option>
          </select>
        </label>
      </div>
      <label>书名：<input id="title" type="text" placeholder="可留空以使用文件名" /></label>
      <div class="row">
        <button id="btnParse" class="btn" disabled>解析/预览</button>
        <button id="btnUpload" class="btn btn-primary" disabled>确认发布</button>
        <span class="muted">流程：先在本地解析预览 → 确认发布（公开，所有用户可见）</span>
      </div>
    </div>

    <div class="card col">
      <div id="info" class="muted"></div>
      <div id="previewList" class="list"></div>
      <div id="progWrap" class="progress hidden"><span id="prog"></span></div>
      <div id="progText" class="muted"></div>
      <div id="done" class="hidden"></div>
    </div>
  </div>

  <div class="container footer">
    <div>QQ: 407292550 · WeChat: gdb1314_ · Email: yuhan.huang@whu.edu.cn</div>
  </div>
</body>
</html>
