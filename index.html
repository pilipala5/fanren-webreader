<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灵阅书屋 · 首页</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    // 内置书籍列表
    const BOOKS = [
      { key: '凡人修仙传', manifest: '凡人修仙传/manifest.json', source: 'builtin' },
      { key: '凡人修仙传·仙界篇', manifest: '凡人修仙传·仙界篇/manifest.json', source: 'builtin' },
    ];

    let API_AVAILABLE = false;
    const state = { books: {}, serverBooks: [], progress: {}, userName: null };
    const favs = new Set();

    function el(id){ return document.getElementById(id); }
    async function pingAPI(){ const c=new AbortController(); setTimeout(()=>c.abort(),600); try{ const r=await fetch('/api/health',{signal:c.signal}); API_AVAILABLE=r.ok; }catch{ API_AVAILABLE=false; } }
    async function fetchJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error('加载失败'); return await r.json(); }
    async function authMe(){ if(!API_AVAILABLE) return null; try{ const r=await fetch('/api/auth/me'); if(!r.ok) return null; return await r.json(); }catch{return null;} }
    async function authLogin(username,password){ if(!API_AVAILABLE) return { ok:false, error:'api disabled' }; const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}); return await r.json(); }
    async function authLogout(){ if(!API_AVAILABLE) return; try{ await fetch('/api/auth/logout',{method:'POST'}); }catch{} }

    async function loadBuiltins(){ for(const b of BOOKS){ try{ state.books[b.key]=await fetchJSON(b.manifest); }catch{} } }
    async function loadServerBooks(){ if(!API_AVAILABLE) return; try{ const r=await fetch('/api/books'); if(!r.ok) return; const j=await r.json(); if(j&&j.ok) state.serverBooks=j.items||[]; }catch{} }
    async function loadProgress(){ if(API_AVAILABLE){ try{ const r=await fetch('/api/progress'); if(r.ok){ const j=await r.json(); if(j.ok) state.progress=j.items||{}; }}catch{} } }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function bookCard({ key, title, subtitle, tag, href, pos }){
      const wrap=document.createElement('div'); wrap.className='book-card';
      const a=document.createElement('a'); a.className='link'; a.href=href; a.style.textDecoration='none';
      a.innerHTML = `
        <div class="cover">${escapeHtml(title)}</div>
        <div class="body">
          <div class="title">${escapeHtml(title)}</div>
          <div class="meta">${escapeHtml(subtitle||'')}</div>
          <div class="chips"><span class="chip">${escapeHtml(tag||'')}</span>${pos? `<span class=\"chip\">已读至第 ${pos} 章</span>`:''}</div>
        </div>`;
      wrap.appendChild(a);
      const fav=document.createElement('button'); fav.type='button'; fav.className='fav-btn'+(favs.has(String(key))?' active':''); fav.innerHTML='<span>♥</span>';
      fav.addEventListener('click', async (e)=>{ e.preventDefault(); e.stopPropagation(); await favToggle(String(key)); });
      wrap.appendChild(fav);
      return wrap;
    }

    function renderGrid(){
      const grid = el('bookGrid'); if(!grid) return; grid.innerHTML='';
      // 内置
      for(const b of BOOKS){ const m=state.books[b.key]; if(!m) continue; const total=(m.chapters||[]).length; const k=b.key; const idx=Number(state.progress[k]||localStorage.getItem('novel:p:'+k)||0)||0; grid.appendChild(bookCard({ key:k, title:b.key, subtitle:`章节数：${total}`, tag:'内置', href:'viewer.html?book='+encodeURIComponent(k), pos: idx })); }
      // 服务器
      for(const sb of state.serverBooks){ const k='srv:'+sb.id; const total=sb.chapters||0; const idx=Number(state.progress[k]||localStorage.getItem('novel:p:'+k)||0)||0; grid.appendChild(bookCard({ key:k, title:sb.title, subtitle:`章节数：${total} · 上传者：${sb.uploader}`, tag:'服务器', href:'viewer.html?srv='+encodeURIComponent(sb.id), pos: idx })); }
      // 本地会话（只对当前浏览器可见）
      const sessKeys = Object.keys(sessionStorage).filter(k=>k.startsWith('upload:') && k.endsWith(':manifest'));
      for(const key of sessKeys){ try{ const mani=JSON.parse(sessionStorage.getItem(key)||'null'); if(!mani) continue; const id=mani.id; const cnt=Array.isArray(mani.chapters)? mani.chapters.length:0; const href='viewer.html?upload='+encodeURIComponent(id); grid.appendChild(bookCard({ key:'upload:'+id, title: mani.title||('上传书籍 '+id), subtitle:`本地会话 · 章节数：${cnt}`, tag:'本地', href, pos:0 })); }catch{} }
    }

    // 上传相关：TXT / EPUB / PDF（会话本地）
    function openUpload(){ el('uploadModal').classList.remove('hidden'); }
    function closeUpload(){ el('uploadModal').classList.add('hidden'); }
    function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.referrerPolicy='no-referrer'; s.crossOrigin='anonymous'; s.onload=()=>res(); s.onerror=()=>rej(new Error('加载失败 '+src)); document.head.appendChild(s); }); }
    async function loadScriptAny(list){ let lastErr=null; for(const url of list){ try{ await loadScript(url); return; }catch(e){ lastErr=e; } } throw (lastErr||new Error('加载失败')); }
    async function readFileAsText(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error||new Error('读取失败')); fr.onload=()=>res(String(fr.result||'')); fr.readAsText(file); }); }
    async function readFileSmartText(file){ const buf=await file.arrayBuffer(); try{ const u8=new TextDecoder('utf-8',{fatal:false}); const s=u8.decode(buf); const bad=(s.match(/\uFFFD/g)||[]).length; if(bad>0){ try{ const g=new TextDecoder('gb18030',{fatal:false}); const s2=g.decode(buf); return s2; }catch{ return s; } } return s; }catch{ try{ const g=new TextDecoder('gb18030',{fatal:false}); return g.decode(buf); }catch{ return await readFileAsText(file); } } }
    function splitTxt(text){ const lines=String(text).replace(/\r\n?/g,'\n').split('\n'); const re=/^\s*(?:\u7b2c[\u96f6\u4e00\u4e8c\u4e09\u56db\u4e94\u516d\u4e03\u516b\u4e5d\u5341\u767e\u5343\u4e07\u4e240-9]+[\u7ae0\u8282\u56de\u5377\u90e8\u96c6]\s*)?\u7b2c?[\u96f6\u4e00\u4e8c\u4e09\u56db\u4e94\u516d\u4e03\u516b\u4e5d\u5341\u767e\u5343\u4e07\u4e240-9]+[\u7ae0\u56de][^\n\r]*$/; const heads=[]; for(let i=0;i<lines.length;i++){ const s=lines[i].trim(); if(!s) continue; if(re.test(s)) heads.push([s,i]); } const out=[]; const push=(i,t,b)=>out.push({index:i,title:t,body:b.join('\n').trimStart()}); if(!heads.length){ push(1,'全文',lines); return out; } const firstStart=heads[0][1]; if(lines.slice(0,firstStart).some(x=>x.trim())) push(0,'开篇',lines.slice(0,firstStart)); for(let i=0;i<heads.length;i++){ const [t,s]=heads[i]; const e=i+1<heads.length? heads[i+1][1] : lines.length; const body=lines.slice(s,e); if(!body.length||body[0].trim()!=t.trim()) body.unshift('',t); push(i+1,t,body);} return out; }
    async function handleTxt(file){ const text=await readFileSmartText(file); const chapters=splitTxt(text); const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'txt',chapters:chapters.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of chapters){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }
    async function ensureJSZip(){ if(window.JSZip) return; await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    async function handleEpub(file){ try{ await ensureJSZip(); const zip=await JSZip.loadAsync(file); let opf='content.opf'; try{ const c=await zip.file('META-INF/container.xml').async('string'); const dom=new DOMParser().parseFromString(c,'application/xml'); const rf=dom.querySelector('rootfile'); if(rf) opf=rf.getAttribute('full-path')||opf; }catch{} const opfText=await zip.file(opf).async('string'); const o=new DOMParser().parseFromString(opfText,'application/xml'); const man={}; o.querySelectorAll('manifest>item').forEach(i=>{ man[i.getAttribute('id')]=i.getAttribute('href'); }); const spine=Array.from(o.querySelectorAll('spine>itemref')).map(x=>man[x.getAttribute('idref')]).filter(Boolean); const base=opf.split('/').slice(0,-1).join('/'); const texts=[]; for(let i=0;i<spine.length;i++){ const p=(base? base+'/':'')+spine[i]; const f=zip.file(p); if(!f) continue; try{ const html=await f.async('string'); const doc=new DOMParser().parseFromString(html,'text/html'); const h=doc.querySelector('h1,h2,h3,title'); const title=h? (h.textContent||'').trim().slice(0,60) : ('章节 '+(i+1)); const body=(doc.body? doc.body.innerText : doc.textContent)||''; texts.push({index:i+1,title:title||('章节 '+(i+1)), body: body.trim()}); }catch{} } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'epub',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('EPUB 解析失败'); }
    }
    async function ensurePdfJs(){ if(window['pdfjsLib']) return; await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }
    async function handlePdf(file){ try{ await ensurePdfJs(); const arr=new Uint8Array(await file.arrayBuffer()); const pdf=await pdfjsLib.getDocument({data:arr}).promise; const texts=[]; for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const content=await page.getTextContent(); const s=content.items.map(it=>it.str||'').join(''); texts.push({ index:p, title:'第 '+p+' 页', body:s.trim() }); } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'pdf',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('PDF 解析失败'); }
    }

    /* ===== 重新定义/增强：多 CDN 兜底 + 更多格式 ===== */
    async function ensureJSZip(){ if(window.JSZip) return; await loadScriptAny(['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js']); if(!window.JSZip) throw new Error('JSZip 未加载'); }
    async function ensurePdfJs(){ if(window['pdfjsLib']) return; await loadScriptAny(['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js']); if(!window.pdfjsLib) window.pdfjsLib=window['pdfjsLib']; if(!window.pdfjsLib) throw new Error('PDF.js 未加载'); window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }
    function resolvePath(base, rel){ if(!base) return rel; if(!rel) return base; const stack=base.split('/').filter(Boolean); stack.pop(); const parts=rel.split('/'); for(const p of parts){ if(p==='.'||p==='') continue; if(p==='..') stack.pop(); else stack.push(p); } return stack.join('/'); }
    async function handleEpub(file){ try{ await ensureJSZip(); const zip=await JSZip.loadAsync(file); let opf=null; try{ const cf=zip.file('META-INF/container.xml'); if(cf){ const c=await cf.async('string'); const m=String(c).match(/full-path\s*=\s*"([^"]+)"/i); if(m) opf=m[1]; } }catch{} if(!opf){ const keys=Object.keys(zip.files); const cand=keys.filter(k=>/\.opf$/i.test(k)).sort((a,b)=>a.length-b.length); opf=cand[0]||null; } if(!opf) throw new Error('未找到 OPF'); const opfText=await zip.file(opf).async('string'); const o=new DOMParser().parseFromString(opfText,'application/xml'); const man={}; Array.from(o.getElementsByTagName('item')).forEach(i=>{ const id=i.getAttribute('id'); const href=i.getAttribute('href'); if(id&&href) man[id]=href; }); const spine=Array.from(o.getElementsByTagName('itemref')).map(x=>man[x.getAttribute('idref')]).filter(Boolean); if(!spine.length) throw new Error('OPF 无 spine'); const texts=[]; for(let i=0;i<spine.length;i++){ const rel=spine[i]; const p=resolvePath(opf, rel); const f=zip.file(p); if(!f) continue; try{ const html=await f.async('string'); let doc=new DOMParser().parseFromString(html,'text/html'); if(!doc||!doc.body){ doc=new DOMParser().parseFromString(html,'application/xhtml+xml'); } const h=doc.querySelector && doc.querySelector('h1,h2,h3,title'); const title=h? (h.textContent||'').trim().slice(0,60) : ('章节 '+(i+1)); const body=(doc.body? (doc.body.innerText||doc.body.textContent) : doc.textContent)||''; texts.push({index:i+1,title:title||('章节 '+(i+1)), body: String(body||'').trim()}); }catch{} } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'epub',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('EPUB 解析失败: '+(e&&e.message? e.message : e)); }
    }
    async function handleZip(file){ try{ await ensureJSZip(); const zip=await JSZip.loadAsync(file); const keys=Object.keys(zip.files).filter(k=>!zip.files[k].dir && (/\.txt$/i.test(k)||/\.x?html?$/i.test(k))); if(!keys.length) throw new Error('ZIP 内未找到 txt/html'); keys.sort((a,b)=>a.localeCompare(b,'zh-Hans-CN',{numeric:true,sensitivity:'base'})); const texts=[]; let idx=1; for(const k of keys){ const ext=k.split('.').pop().toLowerCase(); if(ext==='txt'){ const s=await zip.file(k).async('string'); const title=k.split('/').pop().replace(/\.[^.]+$/,''); texts.push({index:idx++, title, body:String(s||'').trim()}); } else { const html=await zip.file(k).async('string'); let doc=new DOMParser().parseFromString(html,'text/html'); if(!doc||!doc.body){ doc=new DOMParser().parseFromString(html,'application/xhtml+xml'); } const h=doc.querySelector && doc.querySelector('h1,h2,h3,title'); const title=(h? (h.textContent||'').trim() : k.split('/').pop()).slice(0,60); const body=(doc.body? (doc.body.innerText||doc.body.textContent) : doc.textContent)||''; texts.push({index:idx++, title: title||('章节 '+(idx-1)), body:String(body||'').trim()}); } } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'zip',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('ZIP 解析失败: '+(e&&e.message? e.message : e)); }
    }
    async function ensureMammoth(){ if(window.mammoth) return; await loadScriptAny(['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js','https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js','https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js']); if(!window.mammoth) throw new Error('mammoth 未加载'); }
    async function handleDocx(file){ try{ await ensureMammoth(); const ab=await file.arrayBuffer(); const r=await mammoth.convertToHtml({arrayBuffer:ab}); const html=r&&r.value||''; const doc=new DOMParser().parseFromString(html,'text/html'); const sections=Array.from(doc.querySelectorAll('h1,h2,h3')).map((h,i)=>({ i, title:(h.textContent||'').trim(), node:h })); const texts=[]; if(sections.length){ for(let i=0;i<sections.length;i++){ const cur=sections[i].node; const next=i+1<sections.length? sections[i+1].node : null; let body=''; let n=cur.nextSibling; while(n && n!==next){ if(n.nodeType===1){ body += (n.innerText||n.textContent||'')+'\n'; } else if(n.nodeType===3){ body += n.textContent; } n=n.nextSibling; } texts.push({ index:i+1, title: sections[i].title || ('章节 '+(i+1)), body: body.trim() }); } } else { const body = doc.body ? (doc.body.innerText||doc.body.textContent) : doc.textContent; texts.push({ index:1, title: file.name.replace(/\.[^.]+$/,''), body: String(body||'').trim() }); } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'docx',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('DOCX 解析失败: '+(e&&e.message? e.message : e)); }
    }
    async function handleMarkdown(file){ try{ const text=await readFileAsText(file); const lines=String(text).replace(/\r\n?/g,'\n').split('\n'); const heads=[]; for(let i=0;i<lines.length;i++){ if(/^\s*#+\s+/.test(lines[i])) heads.push([lines[i].replace(/^\s*#+\s+/,'').trim(), i]); } const out=[]; const push=(i,t,b)=>out.push({index:i,title:t,body:b.join('\n').trimStart()}); if(!heads.length){ push(1, file.name.replace(/\.[^.]+$/,''), lines); } else { for(let i=0;i<heads.length;i++){ const [t,s]=heads[i]; const e=i+1<heads.length? heads[i+1][1] : lines.length; const body=lines.slice(s,e); push(i+1,t,body); } } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'md',chapters:out.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of out){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('Markdown 解析失败: '+(e&&e.message? e.message : e)); }
    }
    async function handleHtml(file){ try{ const html=await readFileAsText(file); let doc=new DOMParser().parseFromString(html,'text/html'); if(!doc||!doc.body){ doc=new DOMParser().parseFromString(html,'application/xhtml+xml'); } const title=((doc.querySelector&&doc.querySelector('title'))? doc.querySelector('title').textContent : file.name.replace(/\.[^.]+$/,''))||''; const body=(doc.body? (doc.body.innerText||doc.body.textContent) : doc.textContent)||''; const texts=[{ index:1, title: String(title).trim(), body: String(body||'').trim() }]; const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const mani={id:title||file.name,type:'html',chapters:texts.map(c=>({index:c.index,title:c.title}))}; sessionStorage.setItem('upload:'+id+':manifest', JSON.stringify(mani)); for(const ch of texts){ sessionStorage.setItem('upload:'+id+':ch:'+ch.index, ch.body); } renderGrid(); }catch(e){ alert('HTML 解析失败: '+(e&&e.message? e.message : e)); }
    }

    // 收藏 API
    async function favLoad(){ if(!API_AVAILABLE) return; try{ const r=await fetch('/api/favorites'); if(!r.ok) return; const j=await r.json(); if(j&&j.ok){ favs.clear(); for(const it of (j.items||[])) favs.add(String(it.book)); } }catch{} }
    async function favToggle(bookKey){ if(!API_AVAILABLE){ alert('未连接服务器'); return; } if(!state.userName){ if(!await ensureLogin()) return; }
      const action=favs.has(bookKey)? 'remove' : 'add';
      try{ const r=await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action, book:bookKey})}); const j=await r.json(); if(r.ok&&j.ok){ if(action==='add') favs.add(bookKey); else favs.delete(bookKey); renderGrid(); } }catch{}
    }

    // 头部登录状态渲染
    function renderAuth(){ const u=el('userName'); const btnIn=el('btnLogin'); const btnOut=el('btnLogout'); if(state.userName){ u.textContent=state.userName; btnIn.style.display='none'; btnOut.style.display='inline-block'; } else { u.textContent='未登录'; btnIn.style.display='inline-block'; btnOut.style.display='none'; } }
    async function ensureLogin(){ if(!API_AVAILABLE) return false; if(state.userName) return true; const u=prompt('用户名'); if(!u) return false; const p=prompt('密码（≥6位）'); if(!p) return false; const r=await authLogin(u,p); if(r&&r.ok){ state.userName=u; renderAuth(); return true; } alert(r?.error||'登录失败'); return false; }

    async function init(){
      await pingAPI();
      const me = await authMe(); if(me&&me.ok&&me.loggedIn){ state.userName=me.username; }
      renderAuth();
      await loadBuiltins();
      await loadServerBooks();
      await loadProgress();
      if(API_AVAILABLE) await favLoad();
      renderGrid();
      // 事件绑定
      el('btnUpload').addEventListener('click', openUpload);
      el('closeUpload').addEventListener('click', closeUpload);
      el('file').addEventListener('change', async (e)=>{ const files=Array.from(e.target.files||[]); for(const f of files){ try{ if(/\.txt$/i.test(f.name)) await handleTxt(f); else if(/\.epub$/i.test(f.name)) await handleEpub(f); else if(/\.pdf$/i.test(f.name)) await handlePdf(f); else if(/\.zip$/i.test(f.name)) await handleZip(f); else if(/\.docx$/i.test(f.name)) await handleDocx(f); else if(/\.md$/i.test(f.name)) await handleMarkdown(f); else if(/\.x?html?$/i.test(f.name)) await handleHtml(f); else { alert('不支持的文件类型：'+f.name); } }catch(err){ console.error('解析失败', f.name, err); } } e.target.value=''; });
      el('btnLogin').addEventListener('click', async ()=>{ await ensureLogin(); if(API_AVAILABLE) await favLoad(); renderGrid(); });
      el('btnLogout').addEventListener('click', async ()=>{ await authLogout(); state.userName=null; renderAuth(); });
    }
    document.addEventListener('DOMContentLoaded', init);

    // ===== 覆盖与增强：隐藏“本地会话”，并在配额不足时清理未完成缓存 =====
    // 是否在首页显示“本地会话”上传（sessionStorage）
    const SHOW_LOCAL_UPLOADS = false;

    function clearUploadSession(id){
      try{
        const prefix='upload:'+id+':';
        for(const k of Object.keys(sessionStorage)){
          if(k.startsWith(prefix)){
            try{ sessionStorage.removeItem(k); }catch{}
          }
        }
      }catch{}
    }

    function purgeAllLocalUploads(){
      try{
        for(const k of Object.keys(sessionStorage)){
          if(k.startsWith('upload:')){
            try{ sessionStorage.removeItem(k); }catch{}
          }
        }
      }catch{}
    }

    function writeUploadToSessionOrCleanup(id, manifest, chapters){
      const prefix='upload:'+id+':';
      try{
        sessionStorage.setItem(prefix+'manifest', JSON.stringify(manifest));
        for(const ch of chapters){ sessionStorage.setItem(prefix+'ch:'+ch.index, ch.body); }
        return true;
      }catch(e){
        try{
          for(const k of Object.keys(sessionStorage)){
            if(k.startsWith(prefix)){
              try{ sessionStorage.removeItem(k); }catch{}
            }
          }
        }catch{}
        console.error('写入会话存储失败', e);
        alert('存储空间不足，已清理未完成的本地缓存。请改为“保存到服务器”或减小文件后再试。');
        return false;
      }
    }

    // 覆盖渲染逻辑：不展示“本地会话”
    function renderGrid(){
      const grid = el('bookGrid'); if(!grid) return; grid.innerHTML='';
      // 内置
      for(const b of BOOKS){ const m=state.books[b.key]; if(!m) continue; const total=(m.chapters||[]).length; const k=b.key; const idx=Number(state.progress[k]||localStorage.getItem('novel:p:'+k)||0)||0; grid.appendChild(bookCard({ key:k, title:b.key, subtitle:`章节数：${total}`, tag:'内置', href:'viewer.html?book='+encodeURIComponent(k), pos: idx })); }
      // 服务器书库
      for(const sb of state.serverBooks){ const k='srv:'+sb.id; const total=sb.chapters||0; const idx=Number(state.progress[k]||localStorage.getItem('novel:p:'+k)||0)||0; grid.appendChild(bookCard({ key:k, title:sb.title, subtitle:`章节数：${total} · 上传者：${sb.uploader}`, tag:'服务器', href:'viewer.html?srv='+encodeURIComponent(sb.id), pos: idx })); }
      // 可选：仅当允许时才展示本地会话
      if(SHOW_LOCAL_UPLOADS){
        const sessKeys = Object.keys(sessionStorage).filter(k=>k.startsWith('upload:') && k.endsWith(':manifest'));
        for(const key of sessKeys){ try{ const mani=JSON.parse(sessionStorage.getItem(key)||'null'); if(!mani) continue; const id=mani.id; const cnt=Array.isArray(mani.chapters)? mani.chapters.length:0; const href='viewer.html?upload='+encodeURIComponent(id); grid.appendChild(bookCard({ key:'upload:'+id, title: mani.title||('上传书籍 '+id), subtitle:`本地会话 · 章节数：${cnt}`, tag:'本地', href, pos:0 })); }catch{} }
      }
    }

    // 覆盖各上传处理：写入失败即清理并不显示
    async function handleTxt(file){ const text=await readFileSmartText(file); const chapters=splitTxt(text); const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'txt',chapters:chapters.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, chapters)){ renderGrid(); } }
    async function handleEpub(file){ try{ await ensureJSZip(); const zip=await JSZip.loadAsync(file); let opf='content.opf'; try{ const c=await zip.file('META-INF/container.xml').async('string'); const dom=new DOMParser().parseFromString(c,'application/xml'); const rf=dom.querySelector('rootfile'); if(rf) opf=rf.getAttribute('full-path')||opf; }catch{} const opfText=await zip.file(opf).async('string'); const o=new DOMParser().parseFromString(opfText,'application/xml'); const man={}; o.querySelectorAll('manifest>item').forEach(i=>{ man[i.getAttribute('id')]=i.getAttribute('href'); }); const spine=Array.from(o.querySelectorAll('spine>itemref')).map(x=>man[x.getAttribute('idref')]).filter(Boolean); const base=opf.split('/').slice(0,-1).join('/'); const texts=[]; for(let i=0;i<spine.length;i++){ const p=(base? base+'/':'')+spine[i]; const f=zip.file(p); if(!f) continue; try{ const html=await f.async('string'); const doc=new DOMParser().parseFromString(html,'text/html'); const h=doc.querySelector('h1,h2,h3,title'); const title=h? (h.textContent||'').trim().slice(0,60) : ('章节 '+(i+1)); const body=(doc.body? doc.body.innerText : doc.textContent)||''; texts.push({index:i+1,title:title||('章节 '+(i+1)), body: body.trim()}); }catch{} } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'epub',chapters:texts.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, texts)){ renderGrid(); } }catch(e){ alert('EPUB 解析失败: '+(e&&e.message? e.message : e)); }
    async function handlePdf(file){ try{ await ensurePdfJs(); const arr=new Uint8Array(await file.arrayBuffer()); const pdf=await pdfjsLib.getDocument({data:arr}).promise; const texts=[]; for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const content=await page.getTextContent(); const s=content.items.map(it=>it.str||'').join(''); texts.push({ index:p, title:'第 '+p+' 页', body:s.trim() }); } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'pdf',chapters:texts.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, texts)){ renderGrid(); } }catch(e){ alert('PDF 解析失败: '+(e&&e.message? e.message : e)); }
    async function handleDocx(file){ try{ await ensureMammoth(); const ab=await file.arrayBuffer(); const r=await mammoth.convertToHtml({arrayBuffer:ab}); const html=r&&r.value||''; const doc=new DOMParser().parseFromString(html,'text/html'); const sections=Array.from(doc.querySelectorAll('h1,h2,h3')).map((h,i)=>({ i, title:(h.textContent||'').trim(), node:h })); const texts=[]; if(sections.length){ for(let i=0;i<sections.length;i++){ const cur=sections[i].node; const next=i+1<sections.length? sections[i+1].node : null; let body=''; let n=cur.nextSibling; while(n && n!==next){ if(n.nodeType===1){ body += (n.innerText||n.textContent||'')+'\n'; } else if(n.nodeType===3){ body += n.textContent; } n=n.nextSibling; } texts.push({ index:i+1, title: sections[i].title || ('章节 '+(i+1)), body: body.trim() }); } } else { const body = doc.body ? (doc.body.innerText||doc.body.textContent) : doc.textContent; texts.push({ index:1, title: file.name.replace(/\.[^.]+$/,''), body: String(body||'').trim() }); } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'docx',chapters:texts.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, texts)){ renderGrid(); } }catch(e){ alert('DOCX 解析失败: '+(e&&e.message? e.message : e)); }
    async function handleMarkdown(file){ try{ const text=await readFileAsText(file); const lines=String(text).replace(/\r\n?/g,'\n').split('\n'); const heads=[]; for(let i=0;i<lines.length;i++){ if(/^\s*#+\s+/.test(lines[i])) heads.push([lines[i].replace(/^\s*#+\s+/,'').trim(), i]); } const out=[]; const push=(i,t,b)=>out.push({index:i,title:t,body:b.join('\n').trimStart()}); if(!heads.length){ push(1, file.name.replace(/\.[^.]+$/,''), lines); } else { for(let i=0;i<heads.length;i++){ const [t,s]=heads[i]; const e=i+1<heads.length? heads[i+1][1] : lines.length; const body=lines.slice(s,e); push(i+1,t,body); } } const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const title=file.name.replace(/\.[^.]+$/,''); const mani={id,title,type:'md',chapters:out.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, out)){ renderGrid(); } }catch(e){ alert('Markdown 解析失败: '+(e&&e.message? e.message : e)); }
    async function handleHtml(file){ try{ const html=await readFileAsText(file); let doc=new DOMParser().parseFromString(html,'text/html'); if(!doc||!doc.body){ doc=new DOMParser().parseFromString(html,'application/xhtml+xml'); } const title=((doc.querySelector&&doc.querySelector('title'))? doc.querySelector('title').textContent : file.name.replace(/\.[^.]+$/,''))||''; const body=(doc.body? (doc.body.innerText||doc.body.textContent) : doc.textContent)||''; const texts=[{ index:1, title: String(title).trim(), body: String(body||'').trim() }]; const id='u:'+Date.now()+':'+Math.random().toString(36).slice(2); const mani={id:title||file.name,type:'html',chapters:texts.map(c=>({index:c.index,title:c.title}))}; if(writeUploadToSessionOrCleanup(id, mani, texts)){ renderGrid(); } }catch(e){ alert('HTML 解析失败: '+(e&&e.message? e.message : e)); }

    // DOM 就绪后立即清理所有本地上传痕迹，以免展示失败项
    document.addEventListener('DOMContentLoaded', ()=>{ if(!SHOW_LOCAL_UPLOADS){ purgeAllLocalUploads(); renderGrid(); } });
  </script>
</head>
