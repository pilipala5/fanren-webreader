<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灵阅书屋 · 阅读器</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    const FS = { small: 16, medium: 19, large: 22 };
    const BUILTINS = [
      { key: '凡人修仙传', manifest: '凡人修仙传/manifest.json' },
      { key: '凡人修仙传·仙界篇', manifest: '凡人修仙传·仙界篇/manifest.json' },
    ];

    const state = {
      mode: null,        // 'builtin' | 'server'
      bookKey: null,     // builtin key or 'srv:<id>'
      serverId: null,
      chapters: [],
      currentIndex: 0,
      font: 'medium',
      api: false,
      userName: null,
      cache: new Map(),
      manifests: {},
      encoding: 'utf-8',
    };

    const $ = (id) => document.getElementById(id);

    async function pingAPI(){ const c=new AbortController(); setTimeout(()=>c.abort(),800); try{ const r=await fetch('/api/health',{signal:c.signal}); state.api=r.ok; }catch{ state.api=false; } }
    async function authMe(){ if(!state.api) return; try{ const r=await fetch('/api/auth/me'); if(r.ok){ const j=await r.json(); if(j&&j.ok&&j.loggedIn){ state.userName=j.username; } } }catch{} }

    function setFont(key){ state.font=FS[key]? key : 'medium'; document.documentElement.style.setProperty('--content-size', FS[state.font]+'px'); try{ localStorage.setItem('novel:fs', state.font);}catch{} }
    function saveLast(){ try{ localStorage.setItem('novel:last', JSON.stringify({ book: state.bookKey, index: state.currentIndex })); }catch{} }
    function saveProgress(){ try{ localStorage.setItem('novel:p:'+state.bookKey, String(state.currentIndex)); }catch{} }
    async function saveProgressServer(){ if(!state.api || !state.userName) return; try{ await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book: state.bookKey, index: state.currentIndex})}); }catch{} }

    async function fetchJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error('加载失败 '+url); return await r.json(); }
    async function fetchText(url, encoding='utf-8'){
      const enc = String(encoding||'utf-8').toLowerCase();
      if(enc==='utf-8' || enc==='utf8'){ const r=await fetch(url); if(!r.ok) throw new Error('加载失败 '+url); return await r.text(); }
      const r = await fetch(url); if(!r.ok) throw new Error('加载失败 '+url);
      const buf = await r.arrayBuffer();
      const mapped = (enc==='gb2312'||enc==='gbk')? 'gb18030' : enc;
      const dec = new TextDecoder(mapped, { fatal:false });
      return dec.decode(buf);
    }

    async function loadBuiltinsManifests(){ for(const b of BUILTINS){ try{ state.manifests[b.key]=await fetchJSON(b.manifest); }catch{} } }

    async function resolveFromParams(){
      const p = new URLSearchParams(location.search);
      const book = p.get('book');
      const srv = p.get('srv');
      if (book) { state.mode='builtin'; state.bookKey=book; return; }
      if (srv)  { state.mode='server'; state.serverId=String(srv); state.bookKey='srv:'+state.serverId; return; }
      // fallback to last
      try{ const last = JSON.parse(localStorage.getItem('novel:last')||'null'); if(last&&last.book){ state.bookKey=last.book; if(/^srv:\d+/.test(last.book)){ state.mode='server'; state.serverId=last.book.replace(/^srv:/,''); } else { state.mode='builtin'; } state.currentIndex = Number(last.index)||0; return; } }catch{}
      // fallback builtin
      state.mode='builtin'; state.bookKey=BUILTINS[0].key;
    }

    async function loadChapters(){
      if(state.mode==='builtin'){
        const mf = BUILTINS.find(b=>b.key===state.bookKey);
        const m = state.manifests[state.bookKey] || (mf? await fetchJSON(mf.manifest) : null);
        state.encoding = (m&&m.encoding)||'utf-8';
        state.chapters = Array.isArray(m?.chapters)? m.chapters.map(c=>({ index:c.index, title:c.title, file:c.file })) : [];
        state.currentIndex = state.currentIndex || (state.chapters[0]?.index || 0);
      } else if (state.mode==='server') {
        const j = await fetchJSON(`/api/books/${encodeURIComponent(state.serverId)}`);
        if(!j||!j.ok) throw new Error('服务器书籍不存在');
        state.chapters = (j.chapters||[]).map(c=>({ index:c.index, title:c.title }));
        state.currentIndex = state.currentIndex || (state.chapters[0]?.index || 0);
      }
    }

    async function loadAndRender(){
      const chap = state.chapters.find(c=>Number(c.index)===Number(state.currentIndex));
      if(!chap){ $('title').textContent=''; $('content').textContent=''; return; }
      $('chapter').value = String(state.currentIndex);
      $('title').textContent = chap.title || ('第 '+state.currentIndex+' 章');
      let text = '';
      if(state.mode==='builtin'){
        const mf = BUILTINS.find(b=>b.key===state.bookKey);
        const base = (mf && mf.manifest.includes('/')) ? mf.manifest.slice(0, mf.manifest.lastIndexOf('/')) : '';
        const file = (chap.file||'').replace(/^\/+/, '');
        const url = base? (base + '/' + file) : file;
        text = await fetchText(url, state.encoding);
      } else if (state.mode==='server') {
        const url = `/api/books/${encodeURIComponent(state.serverId)}/chapter/${encodeURIComponent(state.currentIndex)}`;
        const r = await fetch(url);
        if(!r.ok) throw new Error('加载失败 '+url);
        text = await r.text();
      }
      $('content').textContent = text;
      saveLast();
      saveProgress();
      await saveProgressServer();
    }

    function bindEvents(){
      $('chapter').addEventListener('change', async (e)=>{ state.currentIndex = Number(e.target.value||0)||0; await loadAndRender(); });
      $('prev').addEventListener('click', async ()=>{ const i=state.chapters.findIndex(c=>Number(c.index)===Number(state.currentIndex)); if(i>0){ state.currentIndex=state.chapters[i-1].index; await loadAndRender(); } });
      $('next').addEventListener('click', async ()=>{ const i=state.chapters.findIndex(c=>Number(c.index)===Number(state.currentIndex)); if(i>=0 && i<state.chapters.length-1){ state.currentIndex=state.chapters[i+1].index; await loadAndRender(); } });
      $('fs').addEventListener('change', (e)=> setFont(e.target.value));
      document.addEventListener('keydown', async (e)=>{ if(e.key==='ArrowLeft'){ $('prev').click(); } else if(e.key==='ArrowRight'){ $('next').click(); } });
    }

    async function init(){
      setFont(localStorage.getItem('novel:fs')||'medium');
      await pingAPI();
      await authMe();
      await loadBuiltinsManifests();
      await resolveFromParams();
      await loadChapters();
      // render chapter options
      const sel = $('chapter'); sel.innerHTML=''; for(const c of state.chapters){ const o=document.createElement('option'); o.value=String(c.index); o.textContent=String(c.index).padStart(4,'0')+' · '+(c.title||('第 '+c.index+' 章')); sel.appendChild(o); }
      if(state.currentIndex) sel.value=String(state.currentIndex);
      bindEvents();
      await loadAndRender();
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="topbar">
    <div class="container row">
      <a class="btn" href="/">← 返回首页</a>
      <div class="brand">灵阅书屋 · 阅读器</div>
      <div class="spacer"></div>
    </div>
  </div>
  <div class="container reader-wrap">
    <div class="reader-header">
      <label>章节：<select id="chapter"></select></label>
      <label>字号：<select id="fs"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select></label>
    </div>
    <div class="reader-content">
      <div class="reader-title" id="title"></div>
      <div id="content" style="white-space:pre-wrap; line-height:1.9"></div>
    </div>
    <div class="bottom-nav">
      <button class="btn nav-btn" id="prev">上一章</button>
      <button class="btn nav-btn" id="next">下一章</button>
    </div>
  </div>
  <div class="container footer">
    <div>QQ: 407292550 · WeChat: gdb1314_ · Email: yuhan.huang@whu.edu.cn</div>
  </div>
</body>
</html>
