<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灵阅书屋 · 阅读器</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .reader-wrap{display:grid;gap:12px}
    .reader-header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .reader-content {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }
    .reader-title{font-weight:700;margin-bottom:8px}
    .bottom-nav{display:flex;gap:10px;justify-content:center}
    .nav-btn{min-width:96px}
    :root{ --content-size: 19px; }
    #content{ white-space: pre-wrap; line-height: 1.9; font-size: var(--content-size); }

/* ======== Mobile & content overflow fixes (local to viewer.html) ======== */
html, body { overflow-x: hidden; }

/* 1) Robust line breaking for long words/URLs */
#content{
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* 2) Reader container width constraints for readability */
.reader-content{
  width: 100%;
  max-width: 72ch;
  margin-inline: auto;
}

/* 3) Prevent media/blocks from causing horizontal scroll */
.reader-content img,
.reader-content video,
.reader-content table,
.reader-content pre,
.reader-content code{
  max-width: 100%;
  overflow: auto;
}

/* 4) Bottom nav is allowed to wrap on small screens */
.bottom-nav{ flex-wrap: wrap; }
.nav-btn{
  min-width: 88px;          /* override 原 96px，减小窄屏压力 */
  flex: 1 1 auto;           /* 小屏可均分并换行 */
  max-width: 240px;
}

/* 5) Header select shouldn't overflow */
.reader-header select{ max-width: 100%; }

/* 极窄屏时，给默认字号轻微下调（不影响你的字号切换逻辑） */
@media (max-width: 380px){
  :root{ --content-size: 17px; }
}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container row">
      <a class="btn" href="/">← 返回首页</a>
      <div class="brand">灵阅书屋</div>
      <div class="spacer"></div>
      <label>字号：
        <select id="fs">
          <option value="small">小</option>
          <option value="medium" selected>中</option>
          <option value="large">大</option>
        </select>
      </label>
    </div>
  </div>

  <div class="container">
    <div class="reader-wrap">
      <div class="reader-header">
        <div class="row">
          <label>来源：
            <select id="mode">
              <option value="builtin" selected>内置书籍</option>
              <option value="remote">服务器书籍</option>
            </select>
          </label>
          <label>书籍：
            <select id="book"></select>
          </label>
          <label>章节：
            <select id="chapter"></select>
          </label>
          <button class="btn" id="reload">刷新章节</button>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <button class="btn" id="backTop">回到顶部</button>
          <button class="btn" id="saveProgress">保存进度</button>
          <button class="btn" id="loadProgress">恢复进度</button>
        </div>
      </div>

      <div class="reader-content">
        <div class="reader-title" id="title">标题</div>
        <div id="content"></div>
      </div>

      <div class="bottom-nav">
        <button class="btn nav-btn" id="prev">上一章</button>
        <button class="btn nav-btn" id="next">下一章</button>
      </div>
    </div>
  </div>

  <div class="container footer">
    <div>QQ: 407292550 · WeChat: gdb1314_ · Email: yuhan.huang@whu.edu.cn</div>
  </div>

  <script>
    /* ===================== 基础状态 ===================== */
    const FS = { small: 16, medium: 19, large: 22 };
    const BUILTINS = [
      { key: '凡人修仙传', manifest: '凡人修仙传/manifest.json' },
      { key: '凡人修仙传·仙界篇', manifest: '凡人修仙传·仙界篇/manifest.json' },
    ];
    const state = {
      mode: 'builtin',
      api: false,
      books: [],    // remote 用
      manifest: null,
      chapters: [],
      currentIndex: 0,
      font: 'medium',
      loading: false,
      loggedIn: false,
      user: null
    };

    const $ = (id) => document.getElementById(id);
    const norm = s => String(s||'').replace(/^[\s\u3000]+|[\s\u3000]+$/g,'').replace(/\s+/g,' ').toLowerCase();

    /* ===================== API / 登录 ===================== */
    async function pingAPI(){
      const c=new AbortController(); setTimeout(()=>c.abort(),800);
      try{ const r=await fetch('/api/health',{signal:c.signal}); state.api=r.ok; }catch{ state.api=false; }
    }
    async function authMe(){
      if(!state.api) return;
      try{
        const r=await fetch('/api/auth/me');
        if(r.ok){ const j=await r.json(); if(j&&j.ok&&j.loggedIn){ state.loggedIn=true; state.user=j.user; } }
      }catch{}
    }

    /* ===================== 字号 ===================== */
    function setFont(key){
      const size = FS[key] ?? FS.medium;
      state.font = key in FS ? key : 'medium';
      document.documentElement.style.setProperty('--content-size', size+'px');
      try{ localStorage.setItem('novel:fs', state.font);}catch{}
      $('fs').value = state.font;
    }

    /* ===================== 内置/远程 书目 ===================== */
    function fillBuiltinBooks(){
      const sel = $('book'); sel.innerHTML = '';
      for(const b of BUILTINS){
        const op = document.createElement('option');
        op.value = b.key; op.textContent = b.key; op.dataset.manifest = b.manifest;
        sel.appendChild(op);
      }
    }
    async function loadRemoteBooks(){
      const sel = $('book'); sel.innerHTML = '';
      if(!state.api){ return; }
      try{
        const r=await fetch('/api/books');
        if(!r.ok) return;
        const j = await r.json();
        if(!Array.isArray(j)) return;
        state.books = j;
        for(const b of j){
          const op = document.createElement('option');
          op.value = b.key; op.textContent = b.name || b.key; op.dataset.manifest = b.manifest;
          sel.appendChild(op);
        }
      }catch{}
    }

    /* ===================== 章节装载 ===================== */
    async function loadManifest(url){
      const r = await fetch(url);
      if(!r.ok) throw new Error('manifest 加载失败');
      const j = await r.json();
      if(!Array.isArray(j?.chapters)) throw new Error('manifest 结构不合法');
      state.manifest = j;
      state.chapters = j.chapters;
      fillChapters();
    }
    function fillChapters(){
      const sel = $('chapter'); sel.innerHTML = '';
      state.chapters.forEach((c, i) => {
        const op = document.createElement('option');
        op.value = i; op.textContent = c.title || `第 ${i+1} 章`;
        sel.appendChild(op);
      });
      sel.value = state.currentIndex;
    }

    async function loadChapter(i){
      i = Math.max(0, Math.min(i, state.chapters.length - 1));
      state.currentIndex = i;
      const chap = state.chapters[i];
      $('title').textContent = chap.title || `第 ${i+1} 章`;
      $('chapter').value = i;

      $('content').textContent = '加载中...';
      try{
        const r = await fetch(chap.url);
        if(!r.ok) throw new Error('章节加载失败');
        const t = await r.text();
        $('content').textContent = t;
        window.scrollTo({top:0, behavior:'smooth'});
      }catch(e){
        $('content').textContent = '加载失败：' + e.message;
      }
    }

    /* ===================== 进度保存/恢复 ===================== */
    function saveProgress(){
      try{
        const key = `novel:${state.mode}:${getBookKey()}`;
        localStorage.setItem(key, String(state.currentIndex));
        alert('已保存到本地');
      }catch{ alert('保存失败'); }
    }
    function loadProgress(){
      try{
        const key = `novel:${state.mode}:${getBookKey()}`;
        const v = localStorage.getItem(key);
        if(v!=null){
          const idx = parseInt(v,10);
          if(!Number.isNaN(idx)){ loadChapter(idx); return; }
        }
        alert('没有可恢复的进度');
      }catch{ alert('读取失败'); }
    }
    function getBookKey(){
      if(state.mode==='builtin'){
        return $('book').value;
      }else{
        const sel = $('book');
        const op = sel.options[sel.selectedIndex];
        return op?.value || '';
      }
    }

    /* ===================== 事件绑定 ===================== */
    function bindEvents(){
      $('fs').addEventListener('change', e=> setFont(e.target.value));
      $('mode').addEventListener('change', async e=>{
        state.mode = e.target.value;
        if(state.mode==='builtin'){ fillBuiltinBooks(); afterBookChanged(); }
        else { await loadRemoteBooks(); afterBookChanged(); }
      });
      $('book').addEventListener('change', afterBookChanged);
      $('chapter').addEventListener('change', e=> loadChapter(parseInt(e.target.value,10)));
      $('reload').addEventListener('click', ()=> loadChapter(state.currentIndex));
      $('prev').addEventListener('click', ()=> loadChapter(state.currentIndex - 1));
      $('next').addEventListener('click', ()=> loadChapter(state.currentIndex + 1));
      $('backTop').addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
      $('saveProgress').addEventListener('click', saveProgress);
      $('loadProgress').addEventListener('click', loadProgress);

      // 键盘左右键翻页
      window.addEventListener('keydown', (e)=>{
        if(e.key==='ArrowLeft'){ e.preventDefault(); $('prev').click(); }
        if(e.key==='ArrowRight'){ e.preventDefault(); $('next').click(); }
      }, {passive:false});
    }

    async function afterBookChanged(){
      const sel = $('book');
      const op = sel.options[sel.selectedIndex];
      const manifest = op?.dataset?.manifest;
      if(!manifest){ $('content').textContent = '未选择书籍'; return; }
      try{
        await loadManifest(manifest);
        await loadChapter(0);
      }catch(e){
        $('content').textContent = '加载失败：' + e.message;
      }
    }

    /* ===================== 启动 ===================== */
    (async function boot(){
      try{
        // 1. API 健康检查 + 授权
        await pingAPI(); await authMe();

        // 2. 字号初始化
        try{
          const v = localStorage.getItem('novel:fs');
          if(v && v in FS){ state.font = v; }
        }catch{}
        setFont(state.font);

        // 3. 模式 + 书目
        const modeSel = $('mode');
        if(state.api){
          // 远程可用，保留默认“内置”，用户可切换
        }else{
          // 远程不可用，直接锁定为内置
          state.mode = 'builtin';
          modeSel.value = 'builtin';
          modeSel.disabled = true;
        }

        // 4. 装载初始书目与章节
        fillBuiltinBooks();
        await afterBookChanged();

        // 5. 事件
        bindEvents();
      }catch(e){
        console.error(e);
        $('content').textContent = '初始化失败：' + e.message;
      }
    })();
  </script>
</body>
</html>
